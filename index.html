<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet" />

    <!-- SEO -->
    <meta name="description" content="Turn smartphone photos into studio-quality product images in 30 seconds. Amazon-compliant white backgrounds, lifestyle scenes & 4K. From 0.20&euro;/photo. No skills needed." />
    <meta name="keywords" content="AI product photography, Amazon product photos, Shopify product images, white background, lifestyle photos, e-commerce photography" />
    <meta name="author" content="FrameFlow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FrameFlow — AI Product Photos for Amazon & Shopify Sellers" />
    <meta property="og:description" content="Turn smartphone photos into studio-quality product images in 30 seconds. Amazon-compliant. From 0.20&euro;/photo." />
    <meta property="og:url" content="https://frameflow.design" />
    <meta property="og:site_name" content="FrameFlow" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FrameFlow — AI Product Photos for Amazon & Shopify Sellers" />
    <meta name="twitter:description" content="Turn smartphone photos into studio-quality product images in 30 seconds. Amazon-compliant. From 0.20&euro;/photo." />

    <!-- Theme -->
    <meta name="theme-color" content="#111111" />

    <title>FrameFlow — AI Product Photos for Amazon & Shopify Sellers</title>

    <!-- FAQ Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is this just another background remover?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. FrameFlow goes far beyond background removal. We automatically add realistic drop shadows, adjust lighting, and generate AI lifestyle scenes — everything you need for marketplace-ready product photos in one tool."
          }
        },
        {
          "@type": "Question",
          "name": "Will the results pass Amazon / Shopify image requirements?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Our output is optimized for major marketplace standards including Amazon (pure white background, proper dimensions) and Shopify. Images are exported at up to 4K resolution."
          }
        },
        {
          "@type": "Question",
          "name": "How many photos can I process?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It depends on your plan. Starter gives you 35 photos/month, Pro gives you 90, and Business gives you 210 — all at 2K resolution. Want 4K? It counts as 1.5 photo credits."
          }
        },
        {
          "@type": "Question",
          "name": "What if I'm not happy with the results?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can regenerate any image with different settings at no extra cost. Our AI learns from your preferences to deliver better results over time. Plus, you get a 14-day free trial to test everything."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use my own lifestyle scenes or just the AI ones?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Both. You can use our AI-generated scenes or upload your own custom backgrounds. The editor gives you full control over placement, shadows, and lighting for each scene."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
